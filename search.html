<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search - PG & Hotels Finder</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<header>

<nav class="navbar">

    <div class="logo">
        <i class="fa-solid fa-hotel"></i>
        PG & Hotels Finder
    </div>

    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="search.html">PG</a></li>
        <li><a href="search.html">Hotels</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
    </ul>

    <a href="login.html" class="login-btn">
        Login
    </a>

</nav>

</header>


<section class="search-page">

    <h1>Find Your Perfect Stay</h1>

    <div class="search-filter">

        <input
            type="text"
            placeholder="Enter city or location">

        <select>
            <option>All</option>
            <option>PG</option>
            <option>Hotel</option>
        </select>

        <select>
            <option>Any Price</option>
            <option>Under ₹5,000</option>
            <option>₹5,000 - ₹10,000</option>
            <option>Above ₹10,000</option>
        </select>

        <button>
            <i class="fa-solid fa-magnifying-glass"></i>
            Search
        </button>

    </div>


    <div class="results">

        <h2>Available Properties</h2>

        <div class="card-container">

            <div class="card">

                <img src="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=600&q=80">

                <h3>Comfort PG</h3>

                <p>📍 Ayodhya</p>

                <p>₹6,500 / Month</p>

                <button>View Details</button>

            </div>


            <div class="card">

                <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=600&q=80">

                <h3>Royal Hotel</h3>

                <p>📍 Lucknow</p>

                <p>₹2,500 / Night</p>

                <button>View Details</button>

            </div>


            <div class="card">

                <img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=600&q=80">

                <h3>Student PG</h3>

                <p>📍 Delhi</p>

                <p>₹5,500 / Month</p>

                <button>View Details</button>

            </div>

        </div>

    </div>

</section>


<script src="js/script.js"></script>

</body>
</html>
