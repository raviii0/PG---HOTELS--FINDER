<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search PG & Hotels</title>

    <link rel="stylesheet" href="css/style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header>

    <nav class="navbar">

        <div class="logo">
            <i class="fa-solid fa-hotel"></i>
            PG & Hotels Finder
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="search.html">PG</a>
            </li>

            <li>
                <a href="search.html">Hotels</a>
            </li>

            <li>
                <a href="#">About</a>
            </li>

            <li>
                <a href="#">Contact</a>
            </li>

        </ul>

        <a href="login.html" class="login-btn">
            Login
        </a>

    </nav>

</header>


<section class="search-page">

    <h1>Find Your Perfect Stay</h1>


    <div class="search-filter">

        <input
            type="text"
            id="locationInput"
            placeholder="Enter city or location">


        <select id="typeFilter">

            <option value="all">
                All
            </option>

            <option value="pg">
                PG
            </option>

            <option value="hotel">
                Hotel
            </option>

        </select>


        <select id="priceFilter">

            <option value="all">
                Any Price
            </option>

            <option value="5000">
                Under ₹5,000
            </option>

            <option value="10000">
                ₹5,000 - ₹10,000
            </option>

            <option value="10001">
                Above ₹10,000
            </option>

        </select>


        <button id="searchButton">

            <i class="fa-solid fa-magnifying-glass"></i>

            Search

        </button>

    </div>


    <div class="results">

        <h2>
            Available Properties
        </h2>


        <div
            class="card-container"
            id="propertyResults">


            <!-- PG 1 -->

            <div
                class="card property-card"
                data-location="ayodhya"
                data-type="pg"
                data-price="6500">

                <img
                    src="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=600&q=80"
                    alt="Comfort PG">

                <h3>
                    Comfort PG
                </h3>

                <p>
                    📍 Ayodhya
                </p>

                <p>
                    ₹6,500 / Month
                </p>

                <a
                    href="details.html"
                    class="card-details-btn">

                    View Details

                </a>

            </div>


            <!-- HOTEL 1 -->

            <div
                class="card property-card"
                data-location="lucknow"
                data-type="hotel"
                data-price="2500">

                <img
                    src="https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=600&q=80"
                    alt="Royal Hotel">

                <h3>
                    Royal Hotel
                </h3>

                <p>
                    📍 Lucknow
                </p>

                <p>
                    ₹2,500 / Night
                </p>

                <a
                    href="details.html"
                    class="card-details-btn">

                    View Details

                </a>

            </div>


            <!-- PG 2 -->

            <div
                class="card property-card"
                data-location="delhi"
                data-type="pg"
                data-price="5500">

                <img
                    src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=600&q=80"
                    alt="Student PG">

                <h3>
                     PG
                </h3>

                <p>
                    📍 Delhi
                </p>

                <p>
                    ₹500
 / Month
                </p>

                <a
                    href="details.html"
                    class="card-details-btn">

                    View Details

                </a>

            </div>


        </div>


        <p
            id="noResults"
            style="display:none; text-align:center; margin-top:30px;">

            No properties found.

        </p>

    </div>

</section>


<script src="js/script.js"></script>

</body>

</html>
